<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Диагностика — Message Aggregator</title>
<style>
  :root {
    --bg: #0b0f14;
    --bg2: #111722;
    --line: #1d2735;
    --txt: #d6deea;
    --muted: #6b7a90;
    --accent: #61d9a0;
    --accent-dim: #2fbd7c;
    --alert: #ff7a6b;
    --warn: #e6b450;
    --mono: 'Cascadia Code', 'JetBrains Mono', 'IBM Plex Mono', ui-monospace, 'Consolas', monospace;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    margin: 0;
    background:
      radial-gradient(1200px 600px at 80% -10%, rgba(97,217,160,0.08), transparent 55%),
      var(--bg);
    color: var(--txt);
    font-family: var(--mono);
    font-size: 13px;
    line-height: 1.5;
    min-height: 100vh;
    padding: 32px 20px 64px;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1080px; margin: 0 auto; }

  .top {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 14px;
    margin-bottom: 22px;
  }
  .top h1 {
    font-size: 20px;
    font-weight: 700;
    letter-spacing: -0.02em;
    color: #eef3fa;
  }
  .top h1 .dot { color: var(--accent); }
  .top .status {
    color: var(--muted);
    font-size: 12px;
  }
  .top .status b { color: var(--txt); }
  .actions { display: flex; gap: 10px; align-items: center; }
  .btn {
    background: var(--bg2);
    color: var(--accent);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 7px 14px;
    font: inherit;
    font-size: 12px;
    cursor: pointer;
    transition: border-color .15s ease, color .15s ease, background .15s ease;
  }
  .btn:hover { border-color: var(--accent-dim); background: #131c29; }
  .autorefresh {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    color: var(--muted);
    font-size: 12px;
    cursor: pointer;
    user-select: none;
  }
  .autorefresh input { accent-color: var(--accent); }

  .empty {
    text-align: center;
    color: var(--muted);
    padding: 70px 20px;
    border: 1px dashed var(--line);
    border-radius: 14px;
  }
  .empty .big { font-size: 15px; color: var(--txt); margin-bottom: 8px; }

  .portal {
    background: var(--bg2);
    border: 1px solid var(--line);
    border-radius: 14px;
    margin-bottom: 18px;
    overflow: hidden;
    box-shadow: 0 6px 24px rgba(0,0,0,0.25);
  }
  .portal-head {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 16px;
    background: linear-gradient(180deg, rgba(255,255,255,0.03), transparent);
    border-bottom: 1px solid var(--line);
  }
  .pbadge {
    font-size: 11px;
    color: var(--bg);
    background: var(--accent-dim);
    border-radius: 6px;
    padding: 2px 8px;
    font-weight: 700;
  }
  .pid { color: var(--txt); font-weight: 600; }
  .ts { margin-left: auto; color: var(--muted); font-size: 11.5px; }
  .meta {
    padding: 8px 16px;
    color: var(--muted);
    font-size: 11.5px;
    border-bottom: 1px solid var(--line);
    display: flex;
    gap: 18px;
    flex-wrap: wrap;
  }
  .meta .k { color: var(--warn); }

  table { width: 100%; border-collapse: collapse; }
  th, td {
    text-align: left;
    padding: 8px 16px;
    border-bottom: 1px solid var(--line);
    font-size: 12px;
    vertical-align: top;
  }
  th {
    color: var(--muted);
    font-weight: 600;
    text-transform: uppercase;
    font-size: 10.5px;
    letter-spacing: 0.06em;
    background: rgba(255,255,255,0.02);
  }
  tr:last-child td { border-bottom: none; }
  .dlg { color: var(--txt); }
  .tag {
    display: inline-block;
    font-size: 10.5px;
    border-radius: 5px;
    padding: 1px 7px;
    border: 1px solid var(--line);
    color: var(--muted);
  }
  .tag.lines { color: var(--warn); border-color: rgba(230,180,80,0.4); }
  .num { color: var(--accent); font-weight: 600; }
  .num.zero { color: var(--alert); }
  .ok { color: var(--accent); }
  .fail { color: var(--alert); font-weight: 700; }

  .footer { margin-top: 26px; color: var(--muted); font-size: 11.5px; opacity: .7; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>Диагностика <span class="dot">▍</span>опроса порталов</h1>
    <div class="actions">
      <span id="last-updated" class="status">не обновлено</span>
      <label class="autorefresh"><input type="checkbox" id="autorefresh" checked /> авто</label>
      <button class="btn" id="refresh-btn" type="button">⟳ Обновить</button>
    </div>
  </div>
  <div id="body">Загрузка…</div>
  <div class="footer">Трасса последнего цикла опроса каждого портала. <span id="hint"></span></div>
</div>

<script>
  (function () {
    var API = "/api/portals/diagnostics";
    var bodyEl = document.getElementById("body");
    var upEl = document.getElementById("last-updated");
    var btnEl = document.getElementById("refresh-btn");
    var autoEl = document.getElementById("autorefresh");
    var hintEl = document.getElementById("hint");

    function fmt(dialogId) { return dialogId; }

    function render(rows) {
      if (!rows || rows.length === 0) {
        bodyEl.innerHTML =
          '<div class="empty"><div class="big">Диагностика пока пуста</div>' +
          'Сообщений пока не было, либо порталы ещё не опрашивались. ' +
          'Отправьте тестовое сообщение и нажмите «Обновить».</div>';
        hintEl.textContent = "";
        return;
      }

      var html = rows.map(function (r) {
        var tr = r.trace || {};
        var trace = tr.trace || [];
        var ts = r.updated_at || tr.generated_at || "—";
        var recent = tr.recent_items;
        var meta =
          '<div class="meta">' +
          '<span>диалогов в опросе: <span class="k">' + (recent === undefined ? "—" : recent) + '</span></span>' +
          '<span>всего записей в трассе: <span class="k">' + trace.length + '</span></span>' +
          '</div>';

        var rowsHtml = trace.map(function (d) {
          var found = d.found || 0;
          var fs = d.first_seen
            ? '<span class="tag" style="color:var(--warn);border-color:rgba(230,180,80,.4)">first-seen</span>'
            : '<span class="tag">known</span>';
          var kind = d.kind === "open_line"
            ? '<span class="tag lines">открытая линия</span>'
            : '<span class="tag">чат</span>';
          return (
            '<tr>' +
            '<td class="dlg">' + fmt(d.dialog_id) + '</td>' +
            '<td>' + kind + ' ' + fs + '</td>' +
            '<td class="' + (found > 0 ? "num" : "num zero") + '">' + found + '</td>' +
            '<td class="num">' + (d.cursor === undefined ? "—" : d.cursor) + '</td>' +
            '</tr>'
          );
        }).join("");

        return (
          '<div class="portal">' +
          '<div class="portal-head">' +
          '<span class="pbadge">портал</span>' +
          '<span class="pid">#' + r.portal_id + '</span>' +
          '<span class="ts">обновлён ' + ts + '</span>' +
          '</div>' + meta +
          '<table><thead><tr>' +
          '<th>Диалог</th><th>Тип</th><th>Найдено входящих</th><th>Курсор</th>' +
          '</tr></thead><tbody>' + rowsHtml +
          '</tbody></table>' +
          '</div>'
        );
      }).join("");

      bodyEl.innerHTML = html;
      hintEl.textContent =
        '«Найдено входящих = 0» в строке first-seen означает, что первое сообщение ' +
        'не было подхвачено — это и есть предмет проверки.';
    }

    function load() {
      fetch(API, { credentials: "same-origin" })
        .then(function (resp) {
          if (!resp.ok) throw new Error("HTTP " + resp.status);
          return resp.json();
        })
        .then(function (rows) {
          render(rows);
          upEl.textContent = "обновлено " + new Date().toLocaleTimeString();
        })
        .catch(function (err) {
          bodyEl.innerHTML =
            '<div class="empty"><div class="big">Не удалось загрузить диагностику</div>' +
            String(err) + '</div>';
          upEl.textContent = "ошибка";
        });
    }

    btnEl.addEventListener("click", load);
    load();
    setInterval(function () {
      if (autoEl.checked) load();
    }, 8000);
  })();
</script>
</body>
</html>
